org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# ⚠️ 刻意关掉 build cache（2026-09-14）：Kotlin 增量编译可能产出「接口/实现方法描述符错配」
# 的 class，而这类坏产物会被 build cache 收下，之后连 `clean` 都修不好 —— 清理后
# `compileDebugKotlin` 会直接 FROM-CACHE 把同一份坏产物原样还原（实测踩过：APK 每次
# 都构建成功，但一点「去写代码」就 AbstractMethodError 闪退）。
# 关掉后每次都是真编译，代价很小（离线 compileDebugKotlin 约 1~2 分钟），
# 换来「BUILD SUCCESSFUL == 产物可信」。配套的产物体检见 tools/abi_check/run.sh。
org.gradle.caching=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
